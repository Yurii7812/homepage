<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" role="img" aria-label="ブレストという思想とブレストトランス密教の位置づけ"><title>ブレストという思想とブレストトランス密教の位置づけ</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#222}</style><rect width="600" height="350" fill="#fff"/><rect x="105" y="13" width="390" height="65" rx="5" fill="#eee" stroke="#333" stroke-width="1.5"/><text x="300" y="41.5" text-anchor="middle" font-size="17" font-weight="650">ブレストという思想</text><text x="300" y="62.5" text-anchor="middle" font-size="13" font-weight="400">思考・信念・意識を自在に扱う</text><path d="M300 78 V106 H150 V126" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M300 106 H450 V126" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="16" y="126" width="268" height="77" rx="5" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="150" y="160.5" text-anchor="middle" font-size="17" font-weight="650">一般的な実践</text><text x="150" y="181.5" text-anchor="middle" font-size="13" font-weight="400">発想・言語学習・思考の整理</text><rect x="316" y="126" width="268" height="77" rx="5" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="450" y="160.5" text-anchor="middle" font-size="17" font-weight="650">ブレストトランス密教</text><text x="450" y="181.5" text-anchor="middle" font-size="13" font-weight="400">特徴的な実践を前面に出す集団</text><path d="M450 203 V225 H378 V243" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M450 225 H522 V243" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="310" y="243" width="137" height="60" rx="5" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="378.5" y="269" text-anchor="middle" font-size="17" font-weight="650">信念の探求</text><text x="378.5" y="290" text-anchor="middle" font-size="13" font-weight="400">全肯定など</text><rect x="454" y="243" width="137" height="60" rx="5" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="522.5" y="269" text-anchor="middle" font-size="17" font-weight="650">意識の探求</text><text x="522.5" y="290" text-anchor="middle" font-size="13" font-weight="400">トランスなど</text><text x="150" y="240" text-anchor="middle" font-size="15" font-weight="400">宗教的枠組みを</text><text x="150" y="262" text-anchor="middle" font-size="15" font-weight="650">採用しなくてもよい</text><text x="300" y="333" text-anchor="middle" font-size="14" font-weight="400">実践領域は重なり得る。必須の修行順序ではない。</text></svg>
