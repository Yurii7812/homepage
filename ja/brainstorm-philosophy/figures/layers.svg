<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 307" role="img" aria-label="ブレストの実践と信仰・意識の領域"><title>ブレストの実践と信仰・意識の領域</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#222}</style><rect width="600" height="307" fill="#fff"/><rect x="82" y="12" width="436" height="66" rx="4" fill="#f1f1f1" stroke="#222" stroke-width="1.5"/><text x="300" y="40" font-size="17" font-weight="650" text-anchor="middle">入口：一般的なブレスト</text><text x="300" y="62" font-size="13" font-weight="400" text-anchor="middle">発想・言語学習・思考の整理</text><path d="M300 78 L300 104" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="82" y="104" width="436" height="66" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="300" y="132" font-size="17" font-weight="650" text-anchor="middle">全肯定・信仰の信仰</text><text x="300" y="154" font-size="13" font-weight="400" text-anchor="middle">信念への向き合い方を探る</text><path d="M300 170 L300 196" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="82" y="196" width="436" height="66" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="300" y="224" font-size="17" font-weight="650" text-anchor="middle">ブレストトランス</text><text x="300" y="246" font-size="13" font-weight="400" text-anchor="middle">意識状態に関する主観的な実践</text><text x="300" y="291" font-size="15" font-weight="400" text-anchor="middle">入口だけを実践してもよい。信仰は必須ではない。</text></svg>
