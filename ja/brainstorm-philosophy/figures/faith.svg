<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 326" role="img" aria-label="信仰の信仰も一つの信仰である"><title>信仰の信仰も一つの信仰である</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#222}</style><rect width="600" height="326" fill="#fff"/><rect x="16" y="14" width="568" height="254" rx="5" fill="#fafafa" stroke="#333" stroke-width="1.5" stroke-dasharray="6 5"/><text x="300" y="39" text-anchor="middle" font-size="17" font-weight="650">信仰として捉えられるもの（例）</text><rect x="38" y="60" width="524" height="72" rx="5" fill="#eee" stroke="#333" stroke-width="1.5"/><text x="300" y="92" text-anchor="middle" font-size="17" font-weight="650">信仰の信仰</text><text x="300" y="113" text-anchor="middle" font-size="13" font-weight="400">「すべては信仰である」という信仰</text><path d="M562 96 H574 V148 H300 V132" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="300" y="168" text-anchor="middle" font-size="13" font-weight="400">自身にも同じ認識を適用する</text><rect x="34" y="184" width="169" height="60" rx="5" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="118.5" y="210" text-anchor="middle" font-size="17" font-weight="650">世界観 A</text><text x="118.5" y="231" text-anchor="middle" font-size="13" font-weight="400">宗教的な見方</text><rect x="215" y="184" width="169" height="60" rx="5" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="299.5" y="210" text-anchor="middle" font-size="17" font-weight="650">世界観 B</text><text x="299.5" y="231" text-anchor="middle" font-size="13" font-weight="400">唯物論</text><rect x="396" y="184" width="169" height="60" rx="5" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="480.5" y="210" text-anchor="middle" font-size="17" font-weight="650">世界観 C</text><text x="480.5" y="231" text-anchor="middle" font-size="13" font-weight="400">懐疑的な見方</text><text x="300" y="290" text-anchor="middle" font-size="16" font-weight="650">信仰の信仰も、採用・保留・手放す対象になる</text><text x="300" y="312" text-anchor="middle" font-size="13" font-weight="400">対象として同列であり、根拠や真理性が等しいという意味ではない</text></svg>
