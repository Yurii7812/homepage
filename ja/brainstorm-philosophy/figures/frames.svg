<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 235" role="img" aria-label="枠組みを採用する・離れる・選び直す"><title>枠組みを採用する・離れる・選び直す</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#222}</style><rect width="600" height="235" fill="#fff"/><rect x="12" y="18" width="180" height="76" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="102" y="51" font-size="17" font-weight="650" text-anchor="middle">枠組みを採用</text><text x="102" y="73" font-size="13" font-weight="400" text-anchor="middle">ある見方で考える</text><rect x="210" y="18" width="180" height="76" rx="4" fill="#f1f1f1" stroke="#222" stroke-width="1.5"/><text x="300" y="51" font-size="17" font-weight="650" text-anchor="middle">距離を取る</text><text x="300" y="73" font-size="13" font-weight="400" text-anchor="middle">前提を問い直す</text><rect x="408" y="18" width="180" height="76" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="498" y="51" font-size="17" font-weight="650" text-anchor="middle">選び直す</text><text x="498" y="73" font-size="13" font-weight="400" text-anchor="middle">必要なら再採用する</text><path d="M192 56 L210 56" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M390 56 L408 56" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M498 94 V153 H102 V94" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="300" y="180" font-size="16" font-weight="650" text-anchor="middle">枠組みは道具になり得る</text><text x="300" y="204" font-size="13" font-weight="400" text-anchor="middle">現実の証拠や安全性は別に確認する</text></svg>
