<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" role="img" aria-label="ブレストという入口と、その先"><title>ブレストという入口と、その先</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#222}</style><rect width="600" height="430" fill="#fff"/><rect x="100" y="12" width="400" height="68" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="300" y="40" font-size="20" font-weight="650" text-anchor="middle">ブレインストーミング</text><text x="300" y="63" font-size="14" font-weight="400" text-anchor="middle">脳を前提とする実践</text><path d="M300 80 V104" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="100" y="104" width="400" height="68" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="300" y="132" font-size="19" font-weight="650" text-anchor="middle">思考・信念・意識の自在</text><text x="300" y="155" font-size="14" font-weight="400" text-anchor="middle">ブレストという思想</text><path d="M300 172 V196" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="100" y="196" width="400" height="68" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="300" y="224" font-size="20" font-weight="650" text-anchor="middle">信仰の信仰</text><text x="300" y="247" font-size="14" font-weight="400" text-anchor="middle">ブレストそのものにも囚われない</text><path d="M300 264 V292" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="100" y="292" width="400" height="68" rx="4" fill="#fff" stroke="#222" stroke-width="1.5" stroke-dasharray="5 5"/><text x="300" y="320" font-size="19" font-weight="650" text-anchor="middle">区別そのものを超える可能性</text><text x="300" y="343" font-size="14" font-weight="400" text-anchor="middle">脳・存在・主体と対象という枠組みも</text><path d="M300 360 V389" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="300" y="412" font-size="17" font-weight="650" text-anchor="middle">その先も、あらかじめ限定しない</text></svg>
