<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-label="ブレストは入口であって可能性の限界ではない"><title>ブレストは入口であって可能性の限界ではない</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#222}</style><rect width="600" height="440" fill="#fff"/><rect x="126" y="13" width="348" height="65" rx="5" fill="#eee" stroke="#333" stroke-width="1.5"/><text x="300" y="41.5" text-anchor="middle" font-size="17" font-weight="650">ブレインストーミング</text><text x="300" y="62.5" text-anchor="middle" font-size="13" font-weight="400">脳を前提とする実践</text><path d="M300 78 V108" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="126" y="108" width="348" height="65" rx="5" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="300" y="136.5" text-anchor="middle" font-size="17" font-weight="650">ブレストという思想</text><text x="300" y="157.5" text-anchor="middle" font-size="13" font-weight="400">思考・信念・意識の自在</text><path d="M300 173 V193 H145 V218" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M300 193 H455 V218" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="18" y="218" width="254" height="67" rx="5" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="145" y="247.5" text-anchor="middle" font-size="17" font-weight="650">現実世界での実践</text><text x="145" y="268.5" text-anchor="middle" font-size="13" font-weight="400">思考法・学習・日常</text><rect x="328" y="218" width="254" height="67" rx="5" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="455" y="247.5" text-anchor="middle" font-size="17" font-weight="650">信仰の信仰</text><text x="455" y="268.5" text-anchor="middle" font-size="13" font-weight="400">脳やブレストも相対化する</text><path d="M455 285 V313" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="306" y="313" width="280" height="65" rx="5" fill="#fff" stroke="#333" stroke-width="1.5" stroke-dasharray="6 5"/><text x="446" y="337" text-anchor="middle" font-size="17" font-weight="650">区別そのものを超える可能性</text><text x="446" y="359" text-anchor="middle" font-size="13" font-weight="400">存在・非存在、主体・対象など</text><path d="M145 285 V331 H207" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="145" y="352" text-anchor="middle" font-size="15" font-weight="400">別の探求</text><path d="M446 378 V402" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M207 331 H267 V402" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="300" y="426" text-anchor="middle" font-size="16" font-weight="650">どの枠組みも最終地点とせず、その先を限定しない</text></svg>
