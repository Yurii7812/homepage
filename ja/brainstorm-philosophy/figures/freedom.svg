<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" aria-label="自在と区別を超える自由"><title>自在と区別を超える自由</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#222}</style><rect width="600" height="250" fill="#fff"/><rect x="12" y="16" width="276" height="144" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="150" y="44" font-size="18" font-weight="650" text-anchor="middle">世界の中での自在</text><text x="150" y="77" font-size="14" font-weight="400" text-anchor="middle">考える・選ぶ・行動する</text><text x="150" y="105" font-size="14" font-weight="400" text-anchor="middle">主体と対象がある</text><text x="150" y="133" font-size="13" font-weight="400" text-anchor="middle">枠組みの中で自由に実践する</text><rect x="312" y="16" width="276" height="144" rx="4" fill="#fff" stroke="#222" stroke-width="1.5" stroke-dasharray="5 5"/><text x="450" y="44" font-size="18" font-weight="650" text-anchor="middle">区別を超える自由</text><text x="450" y="77" font-size="14" font-weight="400" text-anchor="middle">ある・ないという区別</text><text x="450" y="105" font-size="14" font-weight="400" text-anchor="middle">自在に扱うという区別</text><text x="450" y="133" font-size="13" font-weight="400" text-anchor="middle">それ自体もなくなり得る</text><path d="M300 160 V190" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="300" y="216" font-size="17" font-weight="650" text-anchor="middle">どちらも最終的な答えとして固定しない</text><text x="300" y="238" font-size="14" font-weight="400" text-anchor="middle">さらにその先も開かれている</text></svg>
