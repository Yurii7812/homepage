<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 265" role="img" aria-label="自在と、手放す自由"><title>自在と、手放す自由</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#222}</style><rect width="600" height="265" fill="#fff"/><rect x="15" y="16" width="270" height="82" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="150" y="52" font-size="17" font-weight="650" text-anchor="middle">世界の中での自在</text><text x="150" y="74" font-size="13" font-weight="400" text-anchor="middle">多様な実践・選択・行動</text><rect x="315" y="16" width="270" height="82" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="450" y="52" font-size="17" font-weight="650" text-anchor="middle">枠を手放す自由</text><text x="450" y="74" font-size="13" font-weight="400" text-anchor="middle">思考や信念の固定から離れる</text><path d="M150 98 V136 H300 V160" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M450 98 V136 H300" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/><rect x="110" y="160" width="380" height="66" rx="4" fill="#f1f1f1" stroke="#222" stroke-width="1.5"/><text x="300" y="188" font-size="17" font-weight="650" text-anchor="middle">どちらかに固定されない</text><text x="300" y="210" font-size="13" font-weight="400" text-anchor="middle">握ることも、手放すことも選ぶ</text><text x="300" y="252" font-size="13" font-weight="400" text-anchor="middle">悟りについては、この思想独自の見方として扱う</text></svg>
