<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 296" role="img" aria-label="自在と、区別そのものを超える自由"><title>自在と、区別そのものを超える自由</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#222}</style><rect width="600" height="296" fill="#fff"/><rect x="12" y="16" width="276" height="212" rx="5" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="150" y="43" text-anchor="middle" font-size="18" font-weight="650">世界の中での自在</text><rect x="31" y="73" width="94" height="52" rx="5" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="78" y="104" text-anchor="middle" font-size="17" font-weight="650">主体</text><rect x="175" y="73" width="94" height="52" rx="5" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="222" y="104" text-anchor="middle" font-size="17" font-weight="650">対象</text><path d="M125 99 H175" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="150" y="148" text-anchor="middle" font-size="14" font-weight="400">考える・選ぶ・働きかける</text><text x="150" y="176" text-anchor="middle" font-size="15" font-weight="650">区別を前提とした自由</text><text x="150" y="201" text-anchor="middle" font-size="13" font-weight="400">枠組みの中での実践</text><rect x="312" y="16" width="276" height="212" rx="5" fill="#fff" stroke="#333" stroke-width="1.5" stroke-dasharray="6 5"/><text x="450" y="43" text-anchor="middle" font-size="18" font-weight="650">区別を超える自由</text><circle cx="450" cy="107" r="43" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="3 8"/><text x="450" y="111" text-anchor="middle" font-size="16" font-weight="650">区別しない</text><text x="450" y="165" text-anchor="middle" font-size="14" font-weight="400">主体と対象、ある・ない</text><text x="450" y="189" text-anchor="middle" font-size="15" font-weight="650">扱う必要さえないあり方</text><text x="300" y="257" text-anchor="middle" font-size="16" font-weight="650">どちらかを最終的な答えとして固定しない</text><text x="300" y="279" text-anchor="middle" font-size="13" font-weight="400">右側は可能性を表す比喩であり、実証された状態ではない</text></svg>
