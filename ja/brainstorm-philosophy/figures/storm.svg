<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 255" role="img" aria-label="Stormの二つのイメージ"><title>Stormの二つのイメージ</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#222}</style><rect width="600" height="255" fill="#fff"/><rect x="12" y="12" width="268" height="75" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="146" y="44.5" font-size="17" font-weight="650" text-anchor="middle">嵐・混沌</text><text x="146" y="66.5" font-size="13" font-weight="400" text-anchor="middle">固定的な枠をゆるめる</text><rect x="320" y="12" width="268" height="75" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="454" y="44.5" font-size="17" font-weight="650" text-anchor="middle">攻めかかる動き</text><text x="454" y="66.5" font-size="13" font-weight="400" text-anchor="middle">意図を持って探求する</text><path d="M146 87 V111 H300 V138" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M454 87 V111 H300" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/><rect x="134" y="138" width="332" height="70" rx="4" fill="#f1f1f1" stroke="#222" stroke-width="1.5"/><text x="300" y="168" font-size="17" font-weight="650" text-anchor="middle">Brain + Storm</text><text x="300" y="190" font-size="13" font-weight="400" text-anchor="middle">自由な探索と方向性</text><text x="300" y="238" font-size="15" font-weight="400" text-anchor="middle">方向は途中で変わってもよい</text></svg>
