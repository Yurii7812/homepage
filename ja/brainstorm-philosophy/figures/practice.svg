<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 305" role="img" aria-label="不完全な生成と修正の循環"><title>不完全な生成と修正の循環</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#222}</style><rect width="600" height="305" fill="#fff"/><rect x="24" y="16" width="238" height="68" rx="4" fill="#f1f1f1" stroke="#222" stroke-width="1.5"/><text x="143" y="45" font-size="17" font-weight="650" text-anchor="middle">まず生成する</text><text x="143" y="67" font-size="13" font-weight="400" text-anchor="middle">間違っていてもよい</text><rect x="338" y="16" width="238" height="68" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="457" y="45" font-size="17" font-weight="650" text-anchor="middle">外部化する</text><text x="457" y="67" font-size="13" font-weight="400" text-anchor="middle">話す・書く・描く</text><rect x="338" y="194" width="238" height="68" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="457" y="223" font-size="17" font-weight="650" text-anchor="middle">検討・修正</text><text x="457" y="245" font-size="13" font-weight="400" text-anchor="middle">根拠や反例を確かめる</text><rect x="24" y="194" width="238" height="68" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="143" y="223" font-size="17" font-weight="650" text-anchor="middle">発展させる</text><text x="143" y="245" font-size="13" font-weight="400" text-anchor="middle">次の問い・表現へ</text><path d="M262 50 L338 50" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M457 84 L457 194" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M338 228 L262 228" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M143 194 L143 84" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/><text x="300" y="130" font-size="17" font-weight="650" text-anchor="middle">生成と評価を分ける</text><text x="300" y="153" font-size="13" font-weight="400" text-anchor="middle">ただし評価をなくすわけではない</text></svg>
