<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 322" role="img" aria-label="信仰の前駆体と、全肯定による帰路"><title>信仰の前駆体と、全肯定による帰路</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#222}</style><rect width="600" height="322" fill="#fff"/><rect x="132" y="10" width="336" height="70" rx="4" fill="#f1f1f1" stroke="#222" stroke-width="1.5"/><text x="300" y="40" font-size="17" font-weight="650" text-anchor="middle">信仰の信仰</text><text x="300" y="62" font-size="13" font-weight="400" text-anchor="middle">特定の内容に固定されない</text><path d="M300 80 L300 111" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/><text x="380" y="102" font-size="13" font-weight="400" text-anchor="middle">採用・没入</text><rect x="132" y="112" width="336" height="70" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="300" y="142" font-size="17" font-weight="650" text-anchor="middle">ある世界観の内側</text><text x="300" y="164" font-size="13" font-weight="400" text-anchor="middle">元のメタ的な視点が薄れることも</text><path d="M300 182 L300 213" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="132" y="214" width="336" height="70" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="300" y="244" font-size="17" font-weight="650" text-anchor="middle">全肯定の実践</text><text x="300" y="266" font-size="13" font-weight="400" text-anchor="middle">別の見方の可能性を開き直す</text><path d="M132 250 H40 V45 H132" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="300" y="310" font-size="13" font-weight="400" text-anchor="middle">戻ることが可能だとする思想上のモデル</text></svg>
