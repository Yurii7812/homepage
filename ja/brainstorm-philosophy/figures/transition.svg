<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 379" role="img" aria-label="前駆体としての信仰の信仰と回帰の可能性"><title>前駆体としての信仰の信仰と回帰の可能性</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#222}</style><rect width="600" height="379" fill="#fff"/><rect x="155" y="18" width="290" height="70" rx="5" fill="#eee" stroke="#333" stroke-width="1.5"/><text x="300" y="49" text-anchor="middle" font-size="17" font-weight="650">信仰の信仰</text><text x="300" y="70" text-anchor="middle" font-size="13" font-weight="400">特定の内容に固定されない</text><path d="M300 88 V109 H102 V135" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M300 109 V135" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M300 109 H498 V135" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="335" y="126" text-anchor="middle" font-size="13" font-weight="400">採用</text><rect x="20" y="135" width="164" height="66" rx="5" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="102" y="164" text-anchor="middle" font-size="17" font-weight="650">世界観 A</text><text x="102" y="185" text-anchor="middle" font-size="13" font-weight="400">メタ視点を保持</text><rect x="218" y="135" width="164" height="66" rx="5" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="300" y="164" text-anchor="middle" font-size="17" font-weight="650">世界観 B</text><text x="300" y="185" text-anchor="middle" font-size="13" font-weight="400">没入・視点の喪失</text><rect x="416" y="135" width="164" height="66" rx="5" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="498" y="164" text-anchor="middle" font-size="17" font-weight="650">世界観 C</text><text x="498" y="185" text-anchor="middle" font-size="13" font-weight="400">別の可能性</text><path d="M300 201 V240" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="391" y="225" text-anchor="middle" font-size="13" font-weight="400">再実践のきっかけ</text><rect x="155" y="242" width="290" height="68" rx="5" fill="#eee" stroke="#333" stroke-width="1.5"/><text x="300" y="272" text-anchor="middle" font-size="17" font-weight="650">全肯定</text><text x="300" y="293" text-anchor="middle" font-size="13" font-weight="400">見方の可能性を開き直す</text><path d="M155 276 H7 V52 H155" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="300" y="336" text-anchor="middle" font-size="15" font-weight="650">破線：全肯定による回帰の仮説</text><text x="300" y="359" text-anchor="middle" font-size="13" font-weight="400">採用や回帰は必須ではなく、実際に戻れる保証もない</text></svg>
