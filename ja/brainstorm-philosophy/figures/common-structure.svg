<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-label="ブレスト・信仰の信仰・全肯定に共通する自己包括"><title>ブレスト・信仰の信仰・全肯定に共通する自己包括</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#222}</style><rect width="600" height="440" fill="#fff"/><text x="300" y="25" text-anchor="middle" font-size="19" font-weight="650">自己包括 → 自己の対象化 → 自己の相対化</text><rect x="14" y="42" width="572" height="102" rx="5" fill="#fafafa" stroke="#333" stroke-width="1.5" stroke-dasharray="6 5"/><text x="300" y="62" text-anchor="middle" font-size="15" font-weight="650">ブレストのブレスト： 思考する対象</text><rect x="31" y="76" width="250" height="52" rx="5" fill="#eee" stroke="#333" stroke-width="1.5"/><text x="156" y="107" text-anchor="middle" font-size="17" font-weight="650">ブレスト</text><rect x="319" y="76" width="250" height="52" rx="5" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="444" y="107" text-anchor="middle" font-size="17" font-weight="650">他の思想・方法</text><path d="M281 90 H300 V72 H156 V76" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="300" y="140" text-anchor="middle" font-size="13" font-weight="400"></text><rect x="14" y="154" width="572" height="102" rx="5" fill="#fafafa" stroke="#333" stroke-width="1.5" stroke-dasharray="6 5"/><text x="300" y="174" text-anchor="middle" font-size="15" font-weight="650">信仰の信仰： 信仰として捉える対象</text><rect x="31" y="188" width="250" height="52" rx="5" fill="#eee" stroke="#333" stroke-width="1.5"/><text x="156" y="219" text-anchor="middle" font-size="17" font-weight="650">信仰の信仰</text><rect x="319" y="188" width="250" height="52" rx="5" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="444" y="219" text-anchor="middle" font-size="17" font-weight="650">他の信仰</text><path d="M281 202 H300 V184 H156 V188" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="300" y="252" text-anchor="middle" font-size="13" font-weight="400"></text><rect x="14" y="266" width="572" height="102" rx="5" fill="#fafafa" stroke="#333" stroke-width="1.5" stroke-dasharray="6 5"/><text x="300" y="286" text-anchor="middle" font-size="15" font-weight="650">全肯定： 肯定する対象</text><rect x="31" y="300" width="250" height="52" rx="5" fill="#eee" stroke="#333" stroke-width="1.5"/><text x="156" y="331" text-anchor="middle" font-size="17" font-weight="650">全肯定</text><rect x="319" y="300" width="250" height="52" rx="5" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="444" y="331" text-anchor="middle" font-size="17" font-weight="650">非全肯定・他の見方</text><path d="M281 314 H300 V296 H156 V300" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="300" y="364" text-anchor="middle" font-size="13" font-weight="400"></text><text x="300" y="403" text-anchor="middle" font-size="16" font-weight="650">メタ的な働きを持ちながら、自身も同じ対象に含まれる</text><text x="300" y="425" text-anchor="middle" font-size="13" font-weight="400">同列なのは対象としての位置づけであり、内容や価値ではない</text></svg>
