<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 275" role="img" aria-label="全肯定の自己言及的な構造"><title>全肯定の自己言及的な構造</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#222}</style><rect width="600" height="275" fill="#fff"/><rect x="170" y="12" width="260" height="64" rx="4" fill="#f1f1f1" stroke="#222" stroke-width="1.5"/><text x="300" y="39" font-size="17" font-weight="650" text-anchor="middle">全肯定</text><text x="300" y="61" font-size="13" font-weight="400" text-anchor="middle">あらゆる見方を受け入れる</text><rect x="170" y="172" width="260" height="64" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="300" y="199" font-size="17" font-weight="650" text-anchor="middle">全肯定そのものも肯定</text><text x="300" y="221" font-size="13" font-weight="400" text-anchor="middle">実践自体を対象に含める</text><path d="M430 44 H544 V204 H430" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M170 204 H56 V44 H170" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="300" y="117" font-size="19" font-weight="650" text-anchor="middle">自己言及</text><text x="300" y="139" font-size="13" font-weight="400" text-anchor="middle">全肯定を支える見方も対象になる</text><text x="300" y="260" font-size="13" font-weight="400" text-anchor="middle">確信が回復するという仮説。保証ではない。</text></svg>
