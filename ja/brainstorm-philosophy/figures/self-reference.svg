<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 306" role="img" aria-label="全肯定と非全肯定を含む自己包括"><title>全肯定と非全肯定を含む自己包括</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#222}</style><rect width="600" height="306" fill="#fff"/><rect x="16" y="14" width="568" height="239" rx="5" fill="#fafafa" stroke="#333" stroke-width="1.5" stroke-dasharray="6 5"/><text x="300" y="40" text-anchor="middle" font-size="17" font-weight="650">肯定の対象（例）</text><rect x="42" y="60" width="516" height="70" rx="5" fill="#eee" stroke="#333" stroke-width="1.5"/><text x="300" y="91" text-anchor="middle" font-size="17" font-weight="650">全肯定</text><text x="300" y="112" text-anchor="middle" font-size="13" font-weight="400">肯定する実践そのものも肯定の対象</text><path d="M558 95 H575 V145 H300 V130" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="300" y="165" text-anchor="middle" font-size="14" font-weight="400">自身にも適用する（自己言及）</text><rect x="34" y="181" width="169" height="55" rx="5" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="118.5" y="213.5" text-anchor="middle" font-size="17" font-weight="650">他の見方</text><rect x="215" y="181" width="169" height="55" rx="5" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="299.5" y="213.5" text-anchor="middle" font-size="17" font-weight="650">全肯定の否定</text><rect x="396" y="181" width="169" height="55" rx="5" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="480.5" y="213.5" text-anchor="middle" font-size="17" font-weight="650">採用しない態度</text><text x="300" y="278" text-anchor="middle" font-size="16" font-weight="650">肯定する側を、肯定される側から除外しない</text><text x="300" y="297" text-anchor="middle" font-size="13" font-weight="400">可能性を受け入れることと、事実・行為への賛同は異なる</text></svg>
