<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 600 398" role="img" aria-label="伝えたいこと、自己生成、知識の不足への気づき、フィードバック、修正した表現の再使用を繰り返す循環"><style>text{font-family:system-ui,"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#202020}.node{fill:#fff;stroke:#222;stroke-width:1.4}.soft{fill:#f3f3f3;stroke:#222;stroke-width:1.4}.link{fill:none;stroke:#222;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.small{font-size:13px}.label{font-size:16px;font-weight:600}.sub{font-size:12px;fill:#555}</style><defs><marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#222"/></marker></defs><rect class="node" x="165" y="12" width="270" height="54" rx="4"/><text class="label" x="300" y="35" text-anchor="middle">伝えたいことがある</text><text class="sub" x="300" y="53" text-anchor="middle">問い・意見・経験</text><path class="link" d="M300 66 V84" marker-end="url(#a2)"/><rect class="soft" x="165" y="89" width="270" height="54" rx="4"/><text class="label" x="300" y="112" text-anchor="middle">自分の言葉で表現する</text><text class="sub" x="300" y="130" text-anchor="middle">片言でも、間違っていてもいい</text><path class="link" d="M300 143 V161" marker-end="url(#a2)"/><rect class="node" x="165" y="166" width="270" height="54" rx="4"/><text class="label" x="300" y="189" text-anchor="middle">不足や誤りに気づく</text><text class="sub" x="300" y="207" text-anchor="middle">単語・文法・語順</text><path class="link" d="M300 220 V238" marker-end="url(#a2)"/><rect class="node" x="165" y="243" width="270" height="54" rx="4"/><text class="label" x="300" y="266" text-anchor="middle">フィードバックを受ける</text><text class="sub" x="300" y="284" text-anchor="middle">必要な部分を修正する</text><path class="link" d="M300 297 V315" marker-end="url(#a2)"/><rect class="soft" x="165" y="320" width="270" height="58" rx="4"/><text class="label" x="300" y="345" text-anchor="middle">自分で使い直す</text><text class="sub" x="300" y="363" text-anchor="middle">さらに会話・思考を続ける</text><path class="link" d="M435 349 H526 V116 H440" marker-end="url(#a2)"/><text class="small" x="541" y="231" transform="rotate(-90 541 231)" text-anchor="middle">新しい表現を試す</text></svg>
