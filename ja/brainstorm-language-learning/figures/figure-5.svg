<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 620 280" role="img" aria-label="知的探求と言語学習が重なり、外国語を使った知的活動となるベン図"><style>text{font-family:system-ui,"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#202020}.node{fill:#fff;stroke:#222;stroke-width:1.4}.soft{fill:#f3f3f3;stroke:#222;stroke-width:1.4}.link{fill:none;stroke:#222;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.small{font-size:13px}.label{font-size:16px;font-weight:600}.sub{font-size:12px;fill:#555}</style><circle cx="224" cy="137" r="130" fill="#f1f1f1" fill-opacity=".65" stroke="#222" stroke-width="1.5"/><circle cx="396" cy="137" r="130" fill="#f1f1f1" fill-opacity=".65" stroke="#222" stroke-width="1.5"/><g text-anchor="middle"><text class="label" x="173" y="110">知的探求</text><text class="small" x="173" y="137">哲学・読書</text><text class="small" x="173" y="158">思考・議論</text><text class="label" x="447" y="110">言語学習</text><text class="small" x="447" y="137">語彙・文法</text><text class="small" x="447" y="158">表現能力</text><text x="310" y="117" font-size="13" font-weight="700">外国語を</text><text x="310" y="137" font-size="13" font-weight="700">使った</text><text x="310" y="157" font-size="13" font-weight="700">知的活動</text></g></svg>
