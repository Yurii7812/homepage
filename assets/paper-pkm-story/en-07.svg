<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Addition 6: separate writing from later organization</title><desc id="desc">Addition 6: separate writing from later organization</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#35664d"/></marker></defs><rect width="900" height="420" fill="#f1f5ed"/><g font-family="Noto Sans CJK JP, Noto Sans, sans-serif"><rect x="35" y="25" width="350" height="130" rx="7" fill="#fffdf6" stroke="#91a897" stroke-width="1.5"/><text x="53" y="58" font-size="20" fill="#253b36" font-weight="600" text-anchor="start">1. Write the note</text><text x="53" y="90" font-size="18" fill="#244d78" font-weight="400" text-anchor="start">Do not force a category yet</text><rect x="500" y="25" width="350" height="130" rx="7" fill="#fffdf6" stroke="#91a897" stroke-width="1.5"/><text x="518" y="58" font-size="20" fill="#253b36" font-weight="600" text-anchor="start">2. Choose an ID</text><text x="518" y="90" font-size="18" fill="#244d78" font-weight="400" text-anchor="start">1a — Materials</text><rect x="35" y="230" width="350" height="150" rx="7" fill="#edf4e9" stroke="#91a897" stroke-width="1.5"/><text x="53" y="263" font-size="20" fill="#253b36" font-weight="600" text-anchor="start">3. Add useful index entries</text><text x="53" y="295" font-size="18" fill="#244d78" font-weight="400" text-anchor="start">Shopping → 1a</text><text x="53" y="322" font-size="18" fill="#244d78" font-weight="400" text-anchor="start">Materials → 1a</text><rect x="500" y="230" width="350" height="150" rx="7" fill="#edf4e9" stroke="#91a897" stroke-width="1.5"/><text x="518" y="263" font-size="20" fill="#253b36" font-weight="600" text-anchor="start">4. Add a later connection</text><text x="518" y="295" font-size="18" fill="#244d78" font-weight="400" text-anchor="start">Travel index → 1a</text><text x="518" y="322" font-size="18" fill="#244d78" font-weight="400" text-anchor="start">The ID stays 1a</text><path d="M387 90H498" fill="none" stroke="#35664d" stroke-width="2" marker-end="url(#arrow)"/><path d="M675 157V193H210V228" fill="none" stroke="#35664d" stroke-width="2" marker-end="url(#arrow)"/><path d="M387 300H498" fill="none" stroke="#35664d" stroke-width="2" marker-end="url(#arrow)"/></g></svg>