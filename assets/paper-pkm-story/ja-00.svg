<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">出発点：一枚のA4ノート</title><desc id="desc">出発点：一枚のA4ノート</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#35664d"/></marker></defs><rect width="900" height="420" fill="#f1f5ed"/><g font-family="Noto Sans CJK JP, Noto Sans, sans-serif"><rect x="290" y="20" width="320" height="340" rx="7" fill="#fffdf6" stroke="#91a897" stroke-width="1.5"/><text x="308" y="50" font-size="21" fill="#244d78" font-weight="700" text-anchor="start">1</text><text x="308" y="81" font-size="19" fill="#253b36" font-weight="600" text-anchor="start">カバンを買うなら？</text><text x="308" y="114" font-size="18" fill="#244d78" font-weight="400" text-anchor="start">軽い物がよい。</text><text x="308" y="141" font-size="18" fill="#244d78" font-weight="400" text-anchor="start">雨の日にも持ちたい。</text><text x="308" y="168" font-size="18" fill="#244d78" font-weight="400" text-anchor="start">素材は何がよいだろう。</text><text x="290" y="390" font-size="20" fill="#253b36" font-weight="400" text-anchor="start">今は一枚。まだ探し方には困らない。</text></g></svg>