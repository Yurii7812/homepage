<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px 22px 54px}nav{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.86rem}a{color:inherit;text-underline-offset:3px}nav span{display:flex;gap:13px}nav [aria-current]{font-weight:bold}header{margin:30px 0 18px}h1{font-size:clamp(1.8rem,5vw,2.9rem);font-weight:650;letter-spacing:-.045em;line-height:1.15;margin:0 0 10px}header p{color:var(--muted);margin:0}.stage{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:12px;overflow:hidden}.stage svg{display:block;width:100%;height:auto}.status{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 16px 13px;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}.status strong{color:var(--ink);font-weight:600}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:17px 0}button,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 13px;cursor:pointer}button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);min-width:125px}button:disabled{opacity:.55;cursor:wait}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}label{display:inline-flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}input{width:95px;accent-color:var(--accent)}.hint{color:var(--muted);font-size:.82rem;min-height:1.4em;margin:0}details{margin-top:26px;border-top:1px solid var(--line);padding-top:16px}summary{cursor:pointer;font-weight:600}details p{color:var(--muted);font-size:.92rem}#spectrum{width:100%;max-width:470px;display:block;height:auto}#walker line,#walker path{stroke-linecap:round;stroke-linejoin:round}#walker{pointer-events:none}@media(max-width:520px){main{padding:18px 12px 36px}header{margin-top:25px}.controls{gap:8px}button,select{padding:7px 9px}}

<body>
<main>
<nav><a id="home" href="../#/ja/home.md">← ホーム</a><span><a href="?lang=ja" data-lang="ja">日本語</a><a href="?lang=en" data-lang="en">English</a><a href="?lang=ru" data-lang="ru">Русский</a></span></nav>
<header><h1 id="title">無限階段</h1><p id="subtitle">ペンローズの階段 × シェパードトーン</p></header>
<section class="stage" aria-label="Penrose stairs">
<svg id="scene" viewBox="0 0 680 470" role="img" aria-labelledby="scene-title">
<title id="scene-title">ペンローズの階段を歩く人</title>
<defs><radialGradient id="floor"><stop offset="0" stop-color="#353a32" stop-opacity=".17"/><stop offset="1" stop-color="#353a32" stop-opacity="0"/></radialGradient></defs>
<ellipse cx="340" cy="380" rx="270" ry="70" fill="url(#floor)"/>
<g id="walls"></g><g id="stairs"></g>
<g id="walker" stroke-linecap="round" stroke-linejoin="round"><ellipse id="shadow" rx="13" ry="4" fill="#333" opacity=".17"/><path id="leg-back" stroke="#474b48" stroke-width="4.2" fill="none"/><path id="arm-back" stroke="#8d4434" stroke-width="3.5" fill="none"/><path id="leg-front" stroke="#333a39" stroke-width="4.4" fill="none"/><path id="shoes" stroke="#292c2b" stroke-width="3.4" fill="none"/><path id="torso" fill="#b65b42" stroke="#743e31" stroke-width="1"/><path id="arm-front" stroke="#b65b42" stroke-width="3.6" fill="none"/><circle id="head" r="6.4" fill="#d9ad87" stroke="#59463a" stroke-width=".85"/><path id="hair" fill="#39342f"/></g>
</svg>
<div class="status"><span><span id="step-label">段</span> <strong id="step">01 / 28</strong></span><span><span id="note-label">音</span> <strong id="note">C</strong></span><span><span id="lap-label">周回</span> <strong id="lap">0</strong></span></div>
</section>
<div class="controls"><button class="primary" id="play" type="button">▶ 再生</button><button id="direction" type="button">↑ 登る</button><label><span id="speed-label">速度</span><select id="speed"><option value="0.7">0.7×</option><option value="1" selected>1×</option><option value="1.4">1.4×</option><option value="2">2×</option></select></label><label><span id="volume-label">音量</span><input type="range" id="volume" min="0" max="100" value="25"></label></div>
<p class="hint" id="hint">再生を押すと音が鳴ります。音量は小さめからお試しください。</p>
<details><summary id="how">仕組み</summary><p id="explain">8つのオクターブ成分を重ね、低音と高音を弱く、中央の音を強くします。ドレミファソラシと上がるにつれて各成分が移動し、最も高い成分は消え、低い成分が現れます。1オクターブごとに同じ周波数と音量の組み合わせに戻ります。28段を1周すると4オクターブ分の循環が完了します。</p><svg id="spectrum" viewBox="0 0 400 110" role="img" aria-label="Eight octave components under a bell-shaped amplitude envelope"></svg></details>
</main>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
const strings={
ja:{title:'無限階段',subtitle:'ペンローズの階段 × シェパードトーン',home:'← ホーム',scene:'ペンローズの階段を歩く人',step:'段',note:'音',lap:'周回',play:'▶ 再生',pause:'Ⅱ 停止',up:'↑ 登る',down:'↓ 降りる',speed:'速度',volume:'音量',hint:'再生を押すと音が鳴ります。音量は小さめからお試しください。',how:'仕組み',explain:'8つのオクターブ成分を重ね、低音と高音を弱く、中央の音を強くします。ドレミファソラシと上がるにつれて各成分が移動し、最も高い成分は消え、低い成分が現れます。1オクターブごとに同じ周波数と音量の組み合わせに戻ります。28段を1周すると4オクターブ分の循環が完了します。',error:'音声を開始できませんでした。ブラウザの音声設定を確認してください。'},
en:{title:'Infinite Staircase',subtitle:'Penrose stairs × Shepard tone',home:'← Home',scene:'A person walking on the Penrose stairs',step:'Step',note:'Note',lap:'Laps',play:'▶ Play',pause:'Ⅱ Pause',up:'↑ Ascend',down:'↓ Descend',speed:'Speed',volume:'Volume',hint:'Press Play to enable sound. Start with the volume low.',how:'How it works',explain:'Eight octave-spaced components are combined, with the middle frequencies louder than the low and high extremes. As the notes ascend through C, D, E, F, G, A and B, the highest component fades out and a low component appears. After one octave the same frequencies and amplitudes recur. One lap of 28 steps completes four octave cycles.',error:'Audio could not start. Check your browser audio settings.'},
ru:{title:'Бесконечная лестница',subtitle:'Лестница Пенроуза × тон Шепарда',home:'← Главная',scene:'Человек идёт по лестнице Пенроуза',step:'Ступень',note:'Нота',lap:'Круги',play:'▶ Пуск',pause:'Ⅱ Пауза',up:'↑ Вверх',down:'↓ Вниз',speed:'Скорость',volume:'Громкость',hint:'Нажмите «Пуск», чтобы включить звук. Начните с малой громкости.',how:'Как это работает',explain:'Восемь звуковых компонентов с интервалом в октаву звучат одновременно. Средние частоты громче крайних. При переходе от до к си верхний компонент постепенно исчезает, а нижний появляется. Через октаву частоты и амплитуды повторяются. Один круг из 28 ступеней соответствует четырём октавным циклам.',error:'Не удалось включить звук. Проверьте настройки браузера.'}
};
const lang=new URLSearchParams(location.search).get('lang');
const l=Object.hasOwn(strings,lang)?lang:'ja', t=strings[l];
document.documentElement.lang=l;document.title=t.title+' | Yurii';
for(const id of ['title','subtitle','home','play','speed-label','volume-label','step-label','note-label','lap-label','hint','how','explain','scene-title']) $(id).textContent=t[id.replace('-label','').replace('scene-title','scene')];
$('home').href='../#/'+l+'/home.md';
document.querySelector('[data-lang="'+l+'"]').setAttribute('aria-current','page');
$('direction').textContent=t.up;
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e}
const mix=(a,b,u)=>[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];
const dy=(p,h)=>[p[0],p[1]+h], mid=(a,b)=>mix(a,b,.5);
const poly=(g,pts,fill)=>el('polygon',{points:pts.map(p=>p.join(',')).join(' '),fill,stroke:'#5c6056','stroke-width':'.9','stroke-linejoin':'round'},g);
// Four local ascending flights use consistent parallel-projection axes.
// The shorter return flights make their positive vertical rises close in screen space.
const N=7,H=4.2,W=23,DEPTH=16,steps=[],faces=[];
const U=[1,.7],V=[-1,.7],neg=a=>[-a[0],-a[1]],add=(a,b)=>[a[0]+b[0],a[1]+b[1]],mul=(a,k)=>[a[0]*k,a[1]*k];
const ds=[U,V,neg(U),neg(V)],ws=[V,U,V,U],lengths=[250,250,166,166];
const corners=[[298,85]];
for(let i=0;i<3;i++)corners.push(dy(add(corners[i],mul(ds[i],lengths[i])),-N*H));
const topColors=['#ebe5d5','#e6dfcc','#f1e9d7','#f0e7d6'];
function face(pts,color,layer=0){faces.push({pts,color,z:pts.reduce((s,p)=>s+p[1],0)/pts.length,layer});}
function edgeWall(a,b,color){face([a,b,dy(b,DEPTH),dy(a,DEPTH)],color);}
function section(c,w){return [add(c,mul(w,-W)),add(c,mul(w,W))];}
for(let i=0;i<4;i++){
 const c=corners[i],d=ds[i],w=ws[i],L=lengths[i],prev=ds[(i+3)%4];
 const nearU=add(c,mul(U,W)),nearV=add(c,mul(V,W));
 const landing=[add(add(c,mul(U,-W)),mul(V,-W)),add(add(c,mul(U,W)),mul(V,-W)),add(add(c,mul(U,W)),mul(V,W)),add(add(c,mul(U,-W)),mul(V,W))];
 face(landing,topColors[i],1);
 for(const [axis,other,center] of [[U,V,nearU],[V,U,nearV]]){
  const same=a=>a[0]===axis[0]&&a[1]===axis[1];
  if(!same(d)&&!same(neg(prev)))edgeWall(add(center,mul(other,-W)),add(center,mul(other,W)),'#a7aa9b');
 }
 steps.push({center:c,side:i});
 const tread=(L-2*W)/(N-1);
 for(let j=0;j<N;j++){
  const boundary=add(c,mul(d,W+j*tread));
  const lower=dy(boundary,-j*H),upper=dy(lower,-H);
  const [al,bl]=section(lower,w),[au,bu]=section(upper,w);
  // Riser and tread are individually shaded; nearer faces occlude farther faces.
  face([al,bl,bu,au],d[1]<0?'#858c81':'#a6a899',0);
  if(j===N-1)continue;
  const finish=add(upper,mul(d,tread)),[ae,be]=section(finish,w);
  face([au,bu,be,ae],topColors[i],1);
  edgeWall(bu,be,i%2===0?'#a5aa9c':'#91998d');
  steps.push({center:mid(upper,finish),side:i});
 }
}
faces.sort((a,b)=>a.z-b.z||a.layer-b.layer);
for(const f of faces)poly($('stairs'),f.pts,f.color);
const count=steps.length,scale=[0,2,4,5,7,9,11],names=['C','D','E','F','G','A','B'];
const mod=(n,m)=>((n%m)+m)%m;
// Fixed log-frequency envelope centered around A4. Smoothly taper the end bins.
const smooth=x=>{const u=Math.max(0,Math.min(1,x));return u*u*(3-2*u);};
const amp=x=>x<=0||x>=8?0:Math.exp(-.5*Math.pow((x-Math.log2(440/16.3515978313))/1.18,2))*smooth(x/.85)*smooth((8-x)/.85);
function components(n){const p=scale[mod(n,7)]/12;return Array.from({length:8},(_,k)=>({f:16.3515978313*Math.pow(2,k+p),a:amp(k+p),x:k+p}));}
const spectrum=$('spectrum'),sx=x=>16+x*46,sy=a=>89-a*68;
el('line',{x1:16,y1:89,x2:384,y2:89,stroke:'currentColor',opacity:'.35'},spectrum);
el('polyline',{points:Array.from({length:81},(_,i)=>sx(i/10)+','+sy(amp(i/10))).join(' '),fill:'none',stroke:'currentColor',opacity:'.35','stroke-dasharray':'4 3'},spectrum);
const bars=Array.from({length:8},()=>el('line',{stroke:'var(--accent)','stroke-width':'4','stroke-linecap':'round'},spectrum));
function drawSpectrum(n){components(n).forEach((c,i)=>{const b=bars[i];b.setAttribute('x1',sx(c.x));b.setAttribute('x2',sx(c.x));b.setAttribute('y1',89);b.setAttribute('y2',sy(c.a));});}
let pos=0,dir=1,travel=0,playing=false,busy=false,session=null,frame=0,lastNote=null;
function pathAt(n,p,d){return mix(steps[mod(n,count)].center,steps[mod(n+d,count)].center,p);}
function footAt(n){
 const q=steps[mod(n,count)],v=ds[q.side],k=mod(n,2)===0?1:-1;
 return add(q.center, [k*(-v[1])*2.3,k*v[0]*2.3]);
}
const fmt=p=>p.map(x=>x.toFixed(2)).join(' ');
function setPath(id,pts){$(id).setAttribute('d',pts.map((p,i)=>(i?'L':'M')+fmt(p)).join(' '));}
function knee(hip,foot,face){
 const delta=[foot[0]-hip[0],foot[1]-hip[1]],dist=Math.max(.1,Math.hypot(...delta));
 const bend=Math.sqrt(Math.max(2,Math.pow(16,2)-Math.pow(dist/2,2)));
 const normal=[delta[1]/dist*face,-delta[0]/dist*face];
 return add(mid(hip,foot),mul(normal,bend*.78));
}
function draw(n,p=0){
 const a=footAt(n-dir),stance=footAt(n),b=footAt(n+dir);
 const u=smooth(p),swing=p<.5?mix(a,stance,smooth(p*2)):mix(stance,b,smooth(p*2-1));
 swing[1]-=Math.sin(Math.PI*p)*9;
 const ground=mix(mid(a,stance),mid(stance,b),u),forward=pathAt(n,1,dir),current=pathAt(n,0,dir);
 const facing=forward[0]>=current[0]?1:-1;
 const hip=[ground[0],ground[1]-24-Math.sin(Math.PI*p)*1.8];
 const shoulder=[hip[0]+facing*3,hip[1]-16],head=[shoulder[0]+facing*1.4,shoulder[1]-8];
 const feet=mod(n,2)===0?[stance,swing]:[swing,stance];
 const order=feet[0][1]<feet[1][1]?[0,1]:[1,0];
 $('shadow').setAttribute('cx',ground[0]);$('shadow').setAttribute('cy',ground[1]+1);
 setPath('leg-back',[hip,knee(hip,feet[order[0]],facing),feet[order[0]]]);
 setPath('leg-front',[hip,knee(hip,feet[order[1]],facing),feet[order[1]]]);
 $('shoes').setAttribute('d',feet.map(f=>'M'+fmt(f)+' L'+fmt(add(f,[facing*4,0]))).join(' '));
 $('torso').setAttribute('d','M'+fmt(add(shoulder,[-4,-2]))+' Q'+fmt(add(shoulder,[0,-5]))+' '+fmt(add(shoulder,[4,-2]))+' L'+fmt(add(hip,[4,1]))+' Q'+fmt(add(hip,[0,3]))+' '+fmt(add(hip,[-4,1]))+' Z');
 const armPhase=Math.cos(Math.PI*p)*(mod(n,2)===0?1:-1)*facing;
 setPath('arm-back',[add(shoulder,[-3,1]),add(shoulder,[-3+armPhase*5,9]),add(shoulder,[-2+armPhase*7,15])]);
 setPath('arm-front',[add(shoulder,[3,1]),add(shoulder,[3-armPhase*5,9]),add(shoulder,[2-armPhase*7,15])]);
 $('head').setAttribute('cx',head[0]);$('head').setAttribute('cy',head[1]);
 $('hair').setAttribute('d','M'+fmt(add(head,[-6,-1]))+' Q'+fmt(add(head,[-5,-9]))+' '+fmt(add(head,[3,-6]))+' Q'+fmt(add(head,[6,-4]))+' '+fmt(add(head,[6,-1]))+' Q'+fmt(add(head,[0,-4]))+' '+fmt(add(head,[-6,-1]))+' Z');
 if(n!==lastNote){
  lastNote=n;$('step').textContent=String(mod(n,count)+1).padStart(2,'0')+' / '+count;$('note').textContent=names[mod(n,7)];$('lap').textContent=String(Math.floor(travel/count));drawSpectrum(n);
 }
}
function schedule(s,n,when){
 const comps=components(n),sum=comps.reduce((a,c)=>a+c.a,0);
 const gate=s.ctx.createGain(),fade=Math.min(.055,s.period*.18),end=when+s.period+fade;
 gate.gain.setValueAtTime(0,when);
 gate.gain.linearRampToValueAtTime(1,when+fade);
 gate.gain.setValueAtTime(1,when+s.period);
 gate.gain.linearRampToValueAtTime(0,end);gate.connect(s.master);
 let remain=comps.length;
 for(const c of comps){
  const osc=s.ctx.createOscillator(),g=s.ctx.createGain();
  osc.type='sine';osc.frequency.value=c.f;g.gain.value=c.a/sum;
  osc.connect(g);g.connect(gate);osc.start(when);osc.stop(end+.005);
  osc.onended=()=>{osc.disconnect();g.disconnect();if(--remain===0)gate.disconnect();};
 }
}
function pump(s){
 const now=s.ctx.currentTime;
 // Re-anchor after a long inactive/throttled interval rather than burst old notes.
 if(s.start+s.next*s.period<now-.12)s.next=Math.max(s.next,Math.ceil((now-s.start)/s.period));
 while(s.start+s.next*s.period<now+.13){schedule(s,s.origin+s.next*s.dir,s.start+s.next*s.period);s.next++;}
}
function tick(s){
 if(session!==s||!playing)return;
 const x=Math.max(0,(s.ctx.currentTime-s.start)/s.period),i=Math.floor(x),p=x-i;
 pos=s.origin+i*s.dir;travel=s.travel+i;draw(pos,p);
 frame=requestAnimationFrame(()=>tick(s));
}
function setVolume(){if(session){const s=session;s.master.gain.setTargetAtTime(Number($('volume').value)/100*.22,s.ctx.currentTime,.025);}}
async function start(){
 if(playing||busy)return;busy=true;$('play').disabled=true;
 let ctx;
 try{
  const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw Error('Web Audio unavailable');
  ctx=new Audio();await ctx.resume();
  const master=ctx.createGain();master.gain.value=Number($('volume').value)/100*.22;master.connect(ctx.destination);
  const s={ctx,master,period:.43/Number($('speed').value),origin:pos,dir,travel,start:ctx.currentTime+.06,next:0,timer:0};
  session=s;playing=true;$('play').textContent=t.pause;$('hint').textContent=t.hint;
  pump(s);s.timer=setInterval(()=>pump(s),25);tick(s);
 }catch(e){if(ctx)ctx.close().catch(()=>{});session=null;playing=false;$('hint').textContent=t.error;}
 finally{busy=false;$('play').disabled=false;}
}
function stop(){
 const s=session;if(!s)return;playing=false;session=null;
 clearInterval(s.timer);cancelAnimationFrame(frame);
 s.master.gain.cancelScheduledValues(s.ctx.currentTime);s.master.gain.setTargetAtTime(0,s.ctx.currentTime,.009);
 setTimeout(()=>s.ctx.close().catch(()=>{}),55);$('play').textContent=t.play;draw(pos,0);
}
$('play').addEventListener('click',()=>playing?stop():start());
$('direction').addEventListener('click',()=>{if(busy)return;const resume=playing;if(resume)stop();dir=-dir;$('direction').textContent=dir===1?t.up:t.down;draw(pos);if(resume)start();});
$('speed').addEventListener('change',()=>{if(playing){stop();start();}});
$('volume').addEventListener('input',setVolume);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)stop();});
window.addEventListener('pagehide',stop);
draw(0);
})();
</script>
