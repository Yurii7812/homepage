<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 880 650" role="img" aria-labelledby="title desc">
<title id="title">Language-learning brainstorm from depend</title>
<desc id="desc">From depend to etymology, derivatives, similar expressions, associations and examples. A mistaken example leads to questions, corrections and new examples.</desc>
<style>
text{font-family:system-ui,"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#202020;font-size:18px}
.link{fill:none;stroke:#333;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.note{font-size:15px;fill:#555}.main{font-size:27px;font-weight:650}.strong{font-weight:600}.small{font-size:16px}
</style>
<rect width="880" height="650" fill="#fff"/>
<g class="link">
<!-- the central word connects to the first ideas, not to predetermined categories -->
<path d="M399 254 L260 163 M440 235 L440 119 M484 251 L613 166 M500 278 L640 300 M395 292 L266 350 M467 305 L515 395"/>
<path d="M180 147 L128 93 M240 143 L297 85 M440 86 L440 46"/>
<path d="M670 143 L696 73 M708 161 L798 113"/>
<path d="M704 316 L744 372 M720 398 L655 456"/>
<path d="M178 370 L144 420 M144 446 L157 493 M157 520 L76 576 M182 520 L287 576"/>
<path d="M529 421 L560 477 M560 505 L538 579 M602 503 L750 565"/>
<!-- a cross-link: the corrected preposition also occurs in rely on -->
<path d="M250 500 C345 480 340 130 608 157" stroke-dasharray="5 5" opacity=".55"/>
</g>
<ellipse cx="440" cy="273" rx="61" ry="38" fill="#fff" stroke="#222" stroke-width="1.8"/>
<text x="440" y="282" text-anchor="middle" class="main">depend</text>
<g text-anchor="middle">
<text x="214" y="153" class="strong">dependent</text>
<text x="95" y="65">independent</text>
<text x="95" y="84" class="note">Opposite meaning</text>
<text x="298" y="58">dependence</text>
<text x="298" y="77" class="note">Noun</text>
<text x="440" y="107">dependere</text>
<text x="440" y="35" class="note">Latin: to hang down</text>
<text x="660" y="160" class="strong">rely on</text>
<text x="697" y="46">trust</text>
<text x="697" y="65" class="note">Free association</text>
<text x="796" y="103">count on</text>
<text x="702" y="305">It depends.</text>
<text x="743" y="390" class="small">Depends on what?</text>
<text x="651" y="474" class="small">It depends on the weather.</text>
<text x="181" y="357" class="note">Make your own examples</text>
<text x="181" y="378">I depend you.</text>
<path d="M164 382 H196" stroke="#222" stroke-width="1.3"/>
<text x="144" y="439" class="small">Why is on needed?</text>
<rect x="60" y="491" width="191" height="30" rx="3" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="155" y="512" class="strong">I depend on you.</text>
<text x="76" y="598" class="small">I depend on</text>
<text x="76" y="618" class="small">my friends.</text>
<text x="287" y="598" class="small">I rely on you.</text>
<text x="287" y="618" class="note">Same use of on</text>
<text x="529" y="413">depend on</text>
<text x="561" y="494" class="small">What do I depend on?</text>
<text x="534" y="598" class="small">My family.</text>
<text x="750" y="586" class="small">I depend on my family.</text>
<text x="750" y="607" class="note">Connect to your own life</text>
</g>
</svg>
