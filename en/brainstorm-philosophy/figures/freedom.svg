<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" aria-label="Freedom of engagement and beyond distinctions"><title>Freedom of engagement and beyond distinctions</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#222}</style><rect width="600" height="250" fill="#fff"/><rect x="12" y="16" width="276" height="144" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="150" y="44" font-size="15.299999999999999" font-weight="650" text-anchor="middle">Freedom within the world</text><text x="150" y="77" font-size="11.9" font-weight="400" text-anchor="middle">Think, choose, act</text><text x="150" y="105" font-size="11.9" font-weight="400" text-anchor="middle">Subject and object exist</text><text x="150" y="133" font-size="11.049999999999999" font-weight="400" text-anchor="middle">Practise freely within a framework</text><rect x="312" y="16" width="276" height="144" rx="4" fill="#fff" stroke="#222" stroke-width="1.5" stroke-dasharray="5 5"/><text x="450" y="44" font-size="15.299999999999999" font-weight="650" text-anchor="middle">Freedom beyond distinctions</text><text x="450" y="77" font-size="11.9" font-weight="400" text-anchor="middle">Existence vs. nonexistence</text><text x="450" y="105" font-size="11.9" font-weight="400" text-anchor="middle">The distinction of free engagement</text><text x="450" y="133" font-size="11.049999999999999" font-weight="400" text-anchor="middle">Even these may disappear</text><path d="M300 160 V190" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="300" y="216" font-size="14.45" font-weight="650" text-anchor="middle">Neither is fixed as the ultimate answer</text><text x="300" y="238" font-size="11.9" font-weight="400" text-anchor="middle">What lies beyond remains open</text></svg>
