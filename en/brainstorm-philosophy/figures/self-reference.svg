<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 275" role="img" aria-label="Self-referential structure of Total Affirmation"><title>Self-referential structure of Total Affirmation</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#222}</style><rect width="600" height="275" fill="#fff"/><rect x="170" y="12" width="260" height="64" rx="4" fill="#f1f1f1" stroke="#222" stroke-width="1.5"/><text x="300" y="39" font-size="14.45" font-weight="650" text-anchor="middle">Total Affirmation</text><text x="300" y="61" font-size="11.049999999999999" font-weight="400" text-anchor="middle">Accept all possible perspectives</text><rect x="170" y="172" width="260" height="64" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="300" y="199" font-size="14.45" font-weight="650" text-anchor="middle">Affirm Total Affirmation itself</text><text x="300" y="221" font-size="11.049999999999999" font-weight="400" text-anchor="middle">Include the practice as an object</text><path d="M430 44 H544 V204 H430" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M170 204 H56 V44 H170" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="300" y="117" font-size="16.15" font-weight="650" text-anchor="middle">Self-reference</text><text x="300" y="139" font-size="11.049999999999999" font-weight="400" text-anchor="middle">Include the view supporting the practice</text><text x="300" y="260" font-size="11.049999999999999" font-weight="400" text-anchor="middle">Restoring conviction is a hypothesis, not a guarantee.</text></svg>
