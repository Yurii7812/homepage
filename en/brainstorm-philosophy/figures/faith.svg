<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 315" role="img" aria-label="Faith in Faith: a vessel not fixed to any worldview"><title>Faith in Faith: a vessel not fixed to any worldview</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#222}</style><rect width="600" height="315" fill="#fff"/><rect x="80" y="12" width="440" height="74" rx="4" fill="#f1f1f1" stroke="#222" stroke-width="1.5"/><text x="300" y="44" font-size="14.45" font-weight="650" text-anchor="middle">The belief that everything is faith</text><text x="300" y="66" font-size="11.049999999999999" font-weight="400" text-anchor="middle">This proposition is also a belief</text><path d="M300 86 V110 H105 V138" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M300 110 H495 V138" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M300 110 L300 138" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="10" y="138" width="190" height="72" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="105" y="169" font-size="14.45" font-weight="650" text-anchor="middle">Worldview A</text><text x="105" y="191" font-size="11.049999999999999" font-weight="400" text-anchor="middle">e.g. religious</text><rect x="205" y="138" width="190" height="72" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="300" y="169" font-size="14.45" font-weight="650" text-anchor="middle">Worldview B</text><text x="300" y="191" font-size="11.049999999999999" font-weight="400" text-anchor="middle">e.g. materialism</text><rect x="400" y="138" width="190" height="72" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="495" y="169" font-size="14.45" font-weight="650" text-anchor="middle">Worldview C</text><text x="495" y="191" font-size="11.049999999999999" font-weight="400" text-anchor="middle">e.g. skepticism</text><text x="300" y="246" font-size="12.75" font-weight="400" text-anchor="middle">One may adopt a view or suspend judgment</text><text x="300" y="276" font-size="12.75" font-weight="650" text-anchor="middle">Adoption does not prove a fact</text></svg>
