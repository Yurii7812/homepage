<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" role="img" aria-label="Свободно выбирать методы по необходимости"><title>Свободно выбирать методы по необходимости</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#222}</style><rect width="600" height="350" fill="#fff"/><rect x="194" y="132" width="212" height="72" rx="4" fill="#f1f1f1" stroke="#222" stroke-width="1.5"/><text x="300" y="163" font-size="14.45" font-weight="650" text-anchor="middle">Отношение брейнсторма</text><text x="300" y="185" font-size="11.049999999999999" font-weight="400" text-anchor="middle">Свободный выбор методов</text><rect x="16" y="14" width="180" height="62" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="106" y="40" font-size="14.45" font-weight="650" text-anchor="middle">Записи</text><text x="106" y="62" font-size="11.049999999999999" font-weight="400" text-anchor="middle">Выражать мысли вовне</text><rect x="210" y="14" width="180" height="62" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="300" y="40" font-size="14.45" font-weight="650" text-anchor="middle">Метод резиновой уточки</text><text x="300" y="62" font-size="11.049999999999999" font-weight="400" text-anchor="middle">Понимать через объяснение</text><rect x="404" y="14" width="180" height="62" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="494" y="40" font-size="14.45" font-weight="650" text-anchor="middle">Случайный стимул</text><text x="494" y="62" font-size="11.049999999999999" font-weight="400" text-anchor="middle">Ассоциации от случайного</text><rect x="16" y="274" width="180" height="62" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="106" y="300" font-size="14.45" font-weight="650" text