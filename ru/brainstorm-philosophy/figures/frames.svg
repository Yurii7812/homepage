<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" role="img" aria-label="Брейнсторм как вход и то, что за ним"><title>Брейнсторм как вход и то, что за ним</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#222}</style><rect width="600" height="430" fill="#fff"/><rect x="100" y="12" width="400" height="68" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="300" y="40" font-size="17" font-weight="650" text-anchor="middle">Мозговой штурм</text><text x="300" y="63" font-size="11.9" font-weight="400" text-anchor="middle">Практика, предполагающая мозг</text><path d="M300 80 V104" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="100" y="104" width="400" height="68" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="300" y="132" font-size="16.15" font-weight="650" text-anchor="middle">Свобода мысли, веры и сознания</text><text x="300" y="155" font-size="11.9" font-weight="400" text-anchor="middle">Брейнсторм как философия</text><path d="M300 172 V196" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="100" y="196" width="400" height="68" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="300" y="224" font-size="17" font-weight="650" text-anchor="middle">Вера в веру</text><text x="300" y="247" font-size="11.9" font-weight="400" text-anchor="middle">Не быть связанным брейнстормом</text><path d="M300 264 V292" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="100" y="292" width="400" height="68" rx="4" fill="#fff" stroke="#222" stroke-width="1.5" stroke-dasharray="5 5"/><text x="300" y="320" font-size="16.15" font-weight="650" text-anchor="middle">Возможность выйти за различия</text><text x="300" y="343" font-size="11.9" font-weight="400" text-anchor="middle">Даже мозг, бытие, субъект и объект</text><path d="M300 360 V389" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="300" y="412" font-size="14.45" font-weight="650" text-anchor="middle">Дальнейшее не предопределено</text></svg>
