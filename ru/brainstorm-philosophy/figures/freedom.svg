<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" aria-label="Свобода обращения и выход за различия"><title>Свобода обращения и выход за различия</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#222}</style><rect width="600" height="250" fill="#fff"/><rect x="12" y="16" width="276" height="144" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="150" y="44" font-size="15.299999999999999" font-weight="650" text-anchor="middle">Свобода в мире</text><text x="150" y="77" font-size="11.9" font-weight="400" text-anchor="middle">Мыслить, выбирать, действовать</text><text x="150" y="105" font-size="11.9" font-weight="400" text-anchor="middle">Есть субъект и объект</text><text x="150" y="133" font-size="11.049999999999999" font-weight="400" text-anchor="middle">Свободно действовать в рамках</text><rect x="312" y="16" width="276" height="144" rx="4" fill="#fff" stroke="#222" stroke-width="1.5" stroke-dasharray="5 5"/><text x="450" y="44" font-size="15.299999999999999" font-weight="650" text-anchor="middle">Свобода за пределами различий</text><text x="450" y="77" font-size="11.9" font-weight="400" text-anchor="middle">Бытие и небытие</text><text x="450" y="105" font-size="11.9" font-weight="400" text-anchor="middle">Различие свободного обращения</text><text x="450" y="133" font-size="11.049999999999999" font-weight="400" text-anchor="middle">Даже они могут исчезнуть</text><path d="M300 160 V190" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="300" y="216" font-size="14.45" font-weight="650" text-anchor="middle">Ничто не фиксируется как окончательный ответ</text><text x="300" y="238" font-size="11.9" font-weight="400" text-anchor="middle">Дальнейшее остаётся открытым</text></svg>
