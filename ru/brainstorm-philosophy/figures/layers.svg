<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 307" role="img" aria-label="Практика брейнсторма, вера и сознание"><title>Практика брейнсторма, вера и сознание</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#222}</style><rect width="600" height="307" fill="#fff"/><rect x="82" y="12" width="436" height="66" rx="4" fill="#f1f1f1" stroke="#222" stroke-width="1.5"/><text x="300" y="40" font-size="14.45" font-weight="650" text-anchor="middle">Вход: обычный брейнсторм</text><text x="300" y="62" font-size="11.049999999999999" font-weight="400" text-anchor="middle">Идеи, языки, организация мыслей</text><path d="M300 78 L300 104" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="82" y="104" width="436" height="66" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="300" y="132" font-size="14.45" font-weight="650" text-anchor="middle">Всеобщее утверждение / Вера в веру</text><text x="300" y="154" font-size="11.049999999999999" font-weight="400" text-anchor="middle">Исследование отношения к вере</text><path d="M300 170 L300 196" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="82" y="196" width="436" height="66" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="300" y="224" font-size="14.45" font-weight="650" text-anchor="middle">Брейнсторм-транс</text><text x="300" y="246" font-size="11.049999999999999" font-weight="400" text-anchor="middle">Субъективная практика сознания</text><text x="300" y="291" font-size="12.75" font-weight="400" text-anchor="middle">Можно ограничиться обычной практикой; вера не обязательна.</text></svg>
