<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 305" role="img" aria-label="Цикл несовершенного создания и исправления"><title>Цикл несовершенного создания и исправления</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;fill:#222}</style><rect width="600" height="305" fill="#fff"/><rect x="24" y="16" width="238" height="68" rx="4" fill="#f1f1f1" stroke="#222" stroke-width="1.5"/><text x="143" y="45" font-size="14.45" font-weight="650" text-anchor="middle">Сначала создавать</text><text x="143" y="67" font-size="11.049999999999999" font-weight="400" text-anchor="middle">Ошибки допустимы</text><rect x="338" y="16" width="238" height="68" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="457" y="45" font-size="14.45" font-weight="650" text-anchor="middle">Выражать вовне</text><text x="457" y="67" font-size="11.049999999999999" font-weight="400" text-anchor="middle">Говорить, писать, рисовать</text><rect x="338" y="194" width="238" height="68" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="457" y="223" font-size="14.45" font-weight="650" text-anchor="middle">Анализ и исправление</text><text x="457" y="245" font-size="11.049999999999999" font-weight="400" text-anchor="middle">Проверять основания и контрпримеры</text><rect x="24" y="194" width="238" height="68" rx="4" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="143" y="223" font-size="14.45" font-weight="650" text-anchor="middle">Развивать дальше</text><text x="143" y="245" font-size="11.049999999999999" font-weight="400" text-anchor="middle">Следующий вопрос или фраза</text><path d="M262 50 L338 50" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M457 84 L457 194" fill="none" stroke="